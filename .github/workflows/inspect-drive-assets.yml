name: Inspect Drive assets

on:
  push:
    branches:
      - arena/1c256bb7-rust
    paths:
      - '.github/workflows/inspect-drive-assets.yml'
  workflow_dispatch:
    inputs:
      file_id:
        description: Google Drive file ID of the assets archive
        required: true
        default: 1b-kDHxNE0aeqpMtLH_iRzdBd2syb0zmp
      release_tag:
        description: GitHub release tag that holds assets.zip
        required: false
        default: sadasd

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Install tools
        run: python -m pip install --quiet pillow

      - name: Download archive from GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ github.event.inputs.release_tag || 'sadasd' }}
        run: |
          gh release download "$RELEASE_TAG" \
            --repo "${{ github.repository }}" \
            --pattern 'assets.zip' \
            --dir /tmp
          ls -lh /tmp/assets.zip
          sha256sum /tmp/assets.zip

      - name: Build full inventory
        run: |
          mkdir -p inspection
          python - <<'PY'
          import zipfile, json, collections, os
          from PIL import Image
          import io

          path = "/tmp/assets.zip"
          z = zipfile.ZipFile(path)
          rows = []
          images = []
          for info in z.infolist():
              name = info.filename
              ext = os.path.splitext(name)[1].lower()
              row = {
                  "path": name,
                  "is_dir": info.is_dir(),
                  "bytes": info.file_size,
                  "compressed": info.compress_size,
                  "ext": ext,
                  "crc32": f"{info.CRC:08x}",
                  "date_time": list(info.date_time),
              }
              if ext in {".png", ".jpg", ".jpeg", ".gif", ".webp", ".bmp", ".tga"} and info.file_size < 40_000_000:
                  try:
                      with Image.open(io.BytesIO(z.read(info))) as im:
                          row["width"], row["height"] = im.size
                          row["mode"] = im.mode
                          images.append((name, im.size))
                  except Exception as exc:
                      row["image_error"] = str(exc)
              rows.append(row)

          by_ext = collections.Counter(r["ext"] for r in rows if not r["is_dir"])
          by_bytes = collections.Counter()
          for r in rows:
              by_bytes[r["ext"]] += r["bytes"]
          summary = {
              "archive": path,
              "archive_bytes": os.path.getsize(path),
              "entries": len(rows),
              "files": sum(1 for r in rows if not r["is_dir"]),
              "dirs": sum(1 for r in rows if r["is_dir"]),
              "total_uncompressed_bytes": sum(r["bytes"] for r in rows),
              "by_ext_counts": dict(by_ext.most_common()),
              "by_ext_bytes": dict(by_bytes.most_common()),
              "top_20_files": sorted(
                  (r for r in rows if not r["is_dir"]),
                  key=lambda r: -r["bytes"],
              )[:20],
              "image_count": len(images),
              "image_dimensions": collections.Counter(str(size) for _, size in images).most_common(30),
          }
          with open("inspection/summary.json", "w", encoding="utf-8") as f:
              json.dump(summary, f, ensure_ascii=False, indent=2)
          with open("inventory.json", "w", encoding="utf-8") as f:
              json.dump(rows, f, ensure_ascii=False, indent=2)
          with open("inspection/tree.txt", "w", encoding="utf-8") as f:
              for r in rows:
                  f.write(f"{r['bytes']:>12}  {r['path']}\n")
          print(json.dumps(summary, ensure_ascii=False, indent=2)[:12000])
          PY

      - name: Deep inventory of every nested archive
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq p7zip-full
          mkdir -p /tmp/assets_extracted
          unzip -q -o /tmp/assets.zip -d /tmp/assets_extracted
          python - <<'PY'
          import os, io, json, gzip, zipfile, subprocess, collections
          from pathlib import Path
          from PIL import Image

          root = Path('/tmp/assets_extracted')
          records = []
          archive_summaries = []

          def image_meta(name, data):
              ext = os.path.splitext(name)[1].lower()
              if ext not in {'.png', '.jpg', '.jpeg', '.webp', '.bmp', '.gif', '.tga'}:
                  return {}
              if len(data) > 12_000_000:
                  return {}
              try:
                  with Image.open(io.BytesIO(data)) as im:
                      return {'width': im.size[0], 'height': im.size[1], 'mode': im.mode}
              except Exception:
                  return {}

          def add_entry(container, name, size, compressed=None, extra=None):
              ext = os.path.splitext(name)[1].lower()
              rec = {
                  'container': str(container),
                  'path': name,
                  'bytes': size,
                  'ext': ext,
              }
              if compressed is not None:
                  rec['compressed'] = compressed
              if extra:
                  rec.update(extra)
              records.append(rec)
              return rec

          files = sorted(p for p in root.rglob('*') if p.is_file())
          for path in files:
              rel = str(path.relative_to(root))
              size = path.stat().st_size
              ext = path.suffix.lower()
              if ext == '.zip':
                  try:
                      with zipfile.ZipFile(path) as z:
                          bad = z.testzip()
                          for info in z.infolist():
                              meta = None
                              if not info.is_dir() and info.file_size < 12_000_000:
                                  meta = image_meta(info.filename, z.read(info))
                              add_entry(rel, info.filename, info.file_size, info.compress_size, meta)
                          archive_summaries.append({
                              'container': rel, 'kind': 'zip', 'entries': len(z.infolist()),
                              'uncompressed': sum(i.file_size for i in z.infolist()),
                              'testzip_first_bad': bad,
                          })
                  except Exception as exc:
                      archive_summaries.append({'container': rel, 'kind': 'zip', 'error': str(exc)})
              elif ext in {'.rar', '.7z'}:
                  try:
                      out = subprocess.run(
                          ['7z', 'l', '-slt', str(path)],
                          check=True, capture_output=True, text=True, timeout=300,
                      ).stdout
                      cur = {}
                      count = 0
                      for line in out.splitlines():
                          if line.strip() == '':
                              if cur.get('Path'):
                                  add_entry(rel, cur['Path'], int(cur.get('Size', 0) or 0))
                                  count += 1
                                  cur = {}
                          elif ' = ' in line:
                              k, v = line.split(' = ', 1)
                              cur[k.strip()] = v.strip()
                      if cur.get('Path'):
                          add_entry(rel, cur['Path'], int(cur.get('Size', 0) or 0))
                          count += 1
                      archive_summaries.append({'container': rel, 'kind': ext[1:], 'entries': count})
                  except Exception as exc:
                      archive_summaries.append({'container': rel, 'kind': ext[1:], 'error': str(exc)})
              else:
                  extra = {}
                  if ext in {'.blend', '.fbx'}:
                      with open(path, 'rb') as f:
                          head = f.read(64)
                      extra['header_hex'] = head[:32].hex()
                      extra['header_text'] = ''.join(chr(b) if 32 <= b < 127 else '.' for b in head[:48])
                  add_entry('(root)', rel, size, extra=extra)

          by_ext = collections.Counter(r['ext'] for r in records)
          by_bytes = collections.Counter()
          for r in records:
              by_bytes[r['ext']] += r['bytes']
          images = [r for r in records if 'width' in r]
          summary = {
              'outer_files': len(files),
              'nested_records': len(records),
              'nested_archives': len(archive_summaries),
              'by_ext': dict(by_ext.most_common(40)),
              'by_bytes': dict(by_bytes.most_common(40)),
              'images_with_dimensions': len(images),
              'image_dimension_histogram': collections.Counter(f"{r['width']}x{r['height']}" for r in images).most_common(40),
              'largest_nested_entries': sorted(records, key=lambda r: -r['bytes'])[:40],
              'archives': archive_summaries,
          }
          with open('inspection/deep_summary.json', 'w', encoding='utf-8') as f:
              json.dump(summary, f, ensure_ascii=False, indent=2)
          with gzip.open('deep_inventory.json.gz', 'wt', encoding='utf-8') as f:
              json.dump(records, f, ensure_ascii=False, separators=(',', ':'))
          print('deep records:', len(records), 'archives:', len(archive_summaries), 'images:', len(images))
          print(json.dumps(summary, ensure_ascii=False, indent=2)[:10000])
          PY

      - name: Extract curated game assets
        run: |
          python - <<'PY'
          import zipfile, shutil
          from pathlib import Path

          root = Path('/tmp/assets_extracted')
          out = Path('game/assets')
          out.mkdir(parents=True, exist_ok=True)

          picks = {
              'assets/Stylized Nature MegaKit_Standard_.zip': {
                  'Textures/Grass.png': 'grass.png',
                  'Textures/Flowers.png': 'flowers.png',
                  'Textures/Mushrooms.png': 'mushrooms.png',
                  'Textures/Leaves_NormalTree.png': 'leaves.png',
                  'Textures/PathRocks_Diffuse.png': 'rocks.png',
              },
              'assets/KayKit_FantasyWeaponsBits_1.0_FREE.zip': {
                  'KayKit_FantasyWeaponsBits_1.0_FREE/Textures/weapons_bits_texture.png': 'weapons.png',
              },
              'assets/KayKit_HalloweenBits_1.0_FREE.zip': {
                  'KayKit_HalloweenBits_1.0_FREE/Assets/textures/halloweenbits_texture.png': 'halloween.png',
              },
              'assets/KayKit_RPGToolsBits_1.0_FREE.zip': {
                  'KayKit_RPGToolsBits_1.0_FREE/Textures/tools_bits_texture.png': 'tools.png',
              },
              'assets/Effects/BattleFXFree.zip': {
                  'BattleFXFree/assets/BinbunVFX_Vol2/BattleFX/icons/leaf.png': 'leaf.png',
              },
              'assets/JDSherbert - Pixel UI SFX Pack (FREE).zip': {
                  'JDSherbert - Pixel UI SFX Pack (FREE)/Mono/ogg/JDSherbert - Pixel UI SFX Pack - Select 1 (Sine).ogg': 'sfx_select.ogg',
                  'JDSherbert - Pixel UI SFX Pack (FREE)/Mono/ogg/JDSherbert - Pixel UI SFX Pack - Popup Open 1 (Sine).ogg': 'sfx_confirm.ogg',
                  'JDSherbert - Pixel UI SFX Pack (FREE)/Mono/ogg/JDSherbert - Pixel UI SFX Pack - Error 1 (Sine).ogg': 'sfx_error.ogg',
              },
              'assets/JDSherbert - Sci Fi UI SFX Pack (FREE).zip': {
                  'JDSherbert - Sci Fi UI SFX Pack (FREE)/Mono/ogg/JDSherbert - Sci Fi UI SFX Pack - Swipe - 1.ogg': 'sfx_shoot.ogg',
                  'JDSherbert - Sci Fi UI SFX Pack (FREE)/Mono/ogg/JDSherbert - Sci Fi UI SFX Pack - Error - 1.ogg': 'sfx_hit.ogg',
                  'JDSherbert - Sci Fi UI SFX Pack (FREE)/Mono/ogg/JDSherbert - Sci Fi UI SFX Pack - Popup Open - 1.ogg': 'sfx_start.ogg',
              },
          }

          copied = []
          for container, mapping in picks.items():
              with zipfile.ZipFile(root / container) as z:
                  for src, dst in mapping.items():
                      if src not in z.namelist():
                          print('MISSING', container, src)
                          continue
                      with z.open(src) as f, open(out / dst, 'wb') as g:
                          shutil.copyfileobj(f, g)
                      copied.append(dst)
          print('copied:', copied)
          for p in sorted(out.iterdir()):
              print(f'{p.stat().st_size:>9} {p.name}')
          PY

      - name: Commit inventory to branch
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "arena-agent"
          git config user.email "agent@arena.ai"
          git checkout -B "$GITHUB_REF_NAME"
          git add -f inspection inventory.json deep_inventory.json.gz game/assets
          git commit -m "Add full asset inventory" || echo "No inventory changes"
          git push origin "HEAD:$GITHUB_REF_NAME"

      - name: Upload inventory
        uses: actions/upload-artifact@v4
        with:
          name: asset-inventory
          path: |
            inspection/
            inventory.json
          if-no-files-found: error
